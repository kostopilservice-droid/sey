<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель — Neoservice</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-8 flex items-center justify-center">

  <!-- БЛОК АВТОРИЗАЦІЇ (ФОРМА ВХОДУ) -->
  <div id="authContainer" class="bg-white rounded-3xl max-w-md w-full p-8 shadow-xl border border-slate-200 hidden">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Вхід в Адмін-панель</h1>
      <p class="text-xs text-slate-500 mt-1">Neoservice Security</p>
    </div>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Email адміністратора</label>
        <input type="email" id="adminEmail" value="kostopilservice@gmail.com" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Пароль</label>
        <input type="password" id="adminPassword" required placeholder="Введіть пароль" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-2xl shadow transition text-sm">
        Увійти в систему
      </button>
      <div id="loginError" class="text-red-500 text-xs text-center font-medium mt-2"></div>
    </form>
    <div class="mt-6 text-center">
      <a href="baza.html" class="text-xs text-blue-600 hover:underline font-semibold">← Назад до Бази знань</a>
    </div>
  </div>

  <!-- ОСНОВНА АДМІН-ПАНЕЛЬ (ПОКАЗУЄТЬСЯ ТІЛЬКИ ПІСЛЯ ВВЕДЕННЯ ПАРОЛЯ) -->
  <div id="adminPanel" class="max-w-4xl w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 md:p-10 relative hidden">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Публікація статті</h1>
        <p class="text-xs text-slate-500 mt-0.5">Адмін: <span id="userEmailDisplay" class="font-semibold text-slate-700"></span></p>
      </div>
      <div class="flex items-center space-x-3">
        <a href="baza.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2 rounded-2xl transition text-xs">Переглянути базу</a>
        <button id="logoutBtn" class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-4 py-2 rounded-2xl transition text-xs">Вийти з адмінки</button>
      </div>
    </div>

    <!-- ФОРМА СТВОРЕННЯ СТАТТІ -->
    <form id="articleForm" class="space-y-6">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Заголовок статті</label>
        <input type="text" id="title" required placeholder="Наприклад: Діагностика осцилографом Hantek..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Категорія</label>
          <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition">
            <option value="autodiagnostics">🚗 Автодіагностика</option>
            <option value="pc">💻 Ремонт ПК</option>
            <option value="office">🖨️ Оргтехніка</option>
            <option value="radio">📻 Радіозв'язок</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">URL обкладинки (зображення)</label>
          <input type="url" id="imageUrl" required placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Посилання на YouTube відео (необов'язково)</label>
        <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Короткий анонс (для картки у стрічці)</label>
        <textarea id="summary" rows="2" required placeholder="Короткий опис проблеми та шляхи вирішення..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition"></textarea>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Повний текст статті</label>
        <textarea id="content" rows="6" required placeholder="Детальний опис процедури, замірів, схем..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-600 transition"></textarea>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition duration-200 text-sm">
        🚀 Опублікувати у Базу знань
      </button>

      <div id="statusMessage" class="text-center text-sm font-semibold hidden"></div>
    </form>
  </div>

  <script>
    // Конфігурація Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBlKoP6-M8tdrKq88bSdnWSnak5Gpddnpk",
    authDomain: "neoservice-ks-ua.firebaseapp.com",
    projectId: "neoservice-ks-ua",
    storageBucket: "neoservice-ks-ua.firebasestorage.app",
    messagingSenderId: "528941827813",
    appId: "1:528941827813:web:354ef989d200087634b60c",
    measurementId: "G-BYGHEHVYY3"
  };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    const authContainer = document.getElementById('authContainer');
    const adminPanel = document.getElementById('adminPanel');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const logoutBtn = document.getElementById('logoutBtn');

    // Налаштовуємо режим роботи сесії: вона збережеться лише до закриття вкладки
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    // Відстеження стану авторизації
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Увійшов — показуємо форму створення статті
        authContainer.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        userEmailDisplay.innerText = user.email;
      } else {
        // Не увійшов — показуємо форма входу з вимогою пароля
        adminPanel.classList.add('hidden');
        authContainer.classList.remove('hidden');
      }
    });

    // Обробка входу
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.innerText = '';
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        console.error(error);
        loginError.innerText = "Помилка входу: невірний Email або пароль.";
      }
    });

    // Вихід із системи (при натисканні "Вийти з адмінки")
    logoutBtn.addEventListener('click', () => {
      auth.signOut();
    });

    // Допоміжна функція для YouTube ID
    function extractYouTubeId(url) {
      if (!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : '';
    }

    // Відправка статті
    const articleForm = document.getElementById('articleForm');
    const statusMessage = document.getElementById('statusMessage');

    articleForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const imageUrl = document.getElementById('imageUrl').value;
      const youtubeUrl = document.getElementById('youtubeUrl').value;
      const summary = document.getElementById('summary').value;
      const content = document.getElementById('content').value;
      
      const youtubeId = extractYouTubeId(youtubeUrl);

      statusMessage.classList.remove('hidden', 'text-green-600', 'text-red-600');
      statusMessage.innerText = 'Збереження у Firebase...';

      try {
        await db.collection('articles').add({
          title,
          category,
          imageUrl,
          youtubeId,
          summary,
          content,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        statusMessage.classList.add('text-green-600');
        statusMessage.innerText = '✅ Статтю успішно опубліковано у Базі знань!';
        articleForm.reset();

        setTimeout(() => {
          statusMessage.classList.add('hidden');
        }, 4000);

      } catch (error) {
        console.error("Помилка публікації:", error);
        statusMessage.classList.add('text-red-600');
        statusMessage.innerText = '❌ Помилка збереження: недостатньо прав або втрачено з\'єднання.';
      }
    });
  </script>
</body>
</html>
