<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель — Neoservice Knowledge Base</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <!-- ФОРМА ДОДАВАННЯ СТАТТІ -->
    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-lg border border-slate-200">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Публікація статті</h1>
        <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">Neoservice Admin</span>
      </div>

      <form id="articleForm" class="space-y-5">
        <!-- Заголовок -->
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Заголовок статті</label>
          <input type="text" id="title" required placeholder="напр., Діагностика осцилографом Hantek" 
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>

        <!-- Категорія -->
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Категорія</label>
          <select id="category" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            <option value="autodiagnostics">🚗 Автодіагностика</option>
            <option value="pc">💻 Ремонт ПК та Ноутбуків</option>
            <option value="office">🖨️ Оргтехніка та ДБЖ</option>
            <option value="radio">📻 Радіозв'язок та SDR</option>
          </select>
        </div>

        <!-- URL зображення -->
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">URL Обкладинки (Зображення)</label>
          <input type="url" id="imageUrl" placeholder="https://example.com/photo.jpg" 
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>

        <!-- Посилання на YouTube -->
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Посилання на YouTube відео (необов'язково)</label>
          <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=XXXXXX або https://youtu.be/XXXXXX" 
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>

        <!-- Короткий анонс -->
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Короткий анонс (для картки у стрічці)</label>
          <textarea id="summary" rows="2" required placeholder="Короткий опис проблеми та шляхи вирішення..." 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></textarea>
        </div>

        <!-- Повний текст -->
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Повний текст статті</label>
          <textarea id="content" rows="6" required placeholder="Детальний опис процедури, замірів, схем..." 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></textarea>
        </div>

        <!-- Кнопка відправки -->
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200">
          🚀 Опублікувати у Базу знань
        </button>
      </form>
      <div id="statusMsg" class="mt-4 text-center text-sm font-semibold hidden"></div>
    </div>

    <!-- ПОПЕРЕДНІЙ ПЕРЕГЛЯД (PREVIEW) -->
    <div class="space-y-4">
      <h2 class="text-xl font-bold text-slate-800">Попередній перегляд картки</h2>
      <p class="text-xs text-slate-500">Так картка виглядатиме для користувачів у стрічці `knowledge_base.html`</p>
      
      <!-- Картка Preview -->
      <div class="bg-white rounded-3xl overflow-hidden shadow-md border border-slate-200">
        <div class="h-48 w-full overflow-hidden relative bg-slate-200 flex items-center justify-center">
          <img id="previewImg" src="https://via.placeholder.com/600x400?text=Обкладинка" alt="Preview" class="w-full h-full object-cover">
        </div>
        <div class="p-6">
          <div class="flex items-center space-x-2 mb-3">
            <span id="previewCategory" class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase">Автодіагностика</span>
            <span id="previewVideoBadge" class="hidden bg-red-100 text-red-600 text-xs font-bold px-2.5 py-0.5 rounded-full">▶ YouTube</span>
          </div>
          <h3 id="previewTitle" class="text-xl font-bold text-slate-900 mb-2">Заголовок статті з'явиться тут...</h3>
          <p id="previewSummary" class="text-slate-600 text-sm leading-relaxed mb-4">Короткий анонс вашої статті ви побачите у цьому блоці при введенні тексту...</p>
          <button type="button" class="w-full bg-slate-100 text-slate-700 font-semibold py-2.5 rounded-xl text-sm">Читати далі</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 1. КОНФІГУРАЦІЯ FIREBASE (Використовуйте свої ключі з проєкту)
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ----------------------------------------------------
    // 2. ІНТЕРАКТИВНИЙ PREVIEW (Живе оновлення картки)
    // ----------------------------------------------------
    const titleInput = document.getElementById('title');
    const summaryInput = document.getElementById('summary');
    const categorySelect = document.getElementById('category');
    const imageUrlInput = document.getElementById('imageUrl');
    const youtubeUrlInput = document.getElementById('youtubeUrl');

    titleInput.addEventListener('input', () => {
      document.getElementById('previewTitle').innerText = titleInput.value || "Заголовок статті з'явиться тут...";
    });

    summaryInput.addEventListener('input', () => {
      document.getElementById('previewSummary').innerText = summaryInput.value || "Короткий анонс вашої статті ви побачите у цьому блоці...";
    });

    categorySelect.addEventListener('change', () => {
      const selectedOption = categorySelect.options[categorySelect.selectedIndex].text;
      document.getElementById('previewCategory').innerText = selectedOption;
    });

    imageUrlInput.addEventListener('input', () => {
      const img = document.getElementById('previewImg');
      img.src = imageUrlInput.value || "https://via.placeholder.com/600x400?text=Обкладинка";
    });

    youtubeUrlInput.addEventListener('input', () => {
      const badge = document.getElementById('previewVideoBadge');
      if (youtubeUrlInput.value.trim() !== "") {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    });

    // Допоміжна функція витягування ID з посилання YouTube
    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // ----------------------------------------------------
    // 3. ВІДПРАВКА ДАНИХ У FIRESTORE (Колекція 'articles')
    // ----------------------------------------------------
    document.getElementById('articleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      submitBtn.disabled = true;
      submitBtn.innerText = "Збереження...";

      try {
        const youtubeId = extractYouTubeId(youtubeUrlInput.value);

        await db.collection('articles').add({
          title: titleInput.value.trim(),
          category: categorySelect.value,
          imageUrl: imageUrlInput.value.trim() || 'https://via.placeholder.com/600x400?text=No+Image',
          youtubeId: youtubeId,
          summary: summaryInput.value.trim(),
          content: document.getElementById('content').value.trim(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        statusMsg.className = "mt-4 text-center text-sm font-semibold text-green-600 block";
        statusMsg.innerText = "✅ Статтю успішно опубліковано в Firebase!";
        
        // Очищення форми
        document.getElementById('articleForm').reset();
        document.getElementById('previewTitle').innerText = "Заголовок статті з'явиться тут...";
        document.getElementById('previewSummary').innerText = "Короткий анонс вашої статті ви побачите у цьому блоці...";
        document.getElementById('previewImg').src = "https://via.placeholder.com/600x400?text=Обкладинка";
        document.getElementById('previewVideoBadge').classList.add('hidden');

      } catch (error) {
        console.error("Помилка додавання:", error);
        statusMsg.className = "mt-4 text-center text-sm font-semibold text-red-600 block";
        statusMsg.innerText = "❌ Помилка при збереженні: " + error.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 Опублікувати у Базу знань";
      }
    });
  </script>
</body>
</html>
