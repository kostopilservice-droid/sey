<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOSERVICE — Автобазар & Автозапчастини</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Open Sans', sans-serif; 
            background-color: #ffffff; 
            color: #2b2b2b; 
        }

        .search-box-red {
            background-color: #db4437;
            border-radius: 4px;
        }
        .btn-blue-search {
            background-color: #29b6f6;
            transition: background 0.2s;
        }
        .btn-blue-search:hover { background-color: #0288d1; }
        .btn-red-expanded {
            background-color: #c62828;
            transition: background 0.2s;
        }
        .btn-red-expanded:hover { background-color: #b71c1c; }
        .btn-green-add {
            background-color: #7cb342;
            transition: background 0.2s;
        }
        .btn-green-add:hover { background-color: #689f38; }

        .state-number-tag {
            background: #ffffff;
            border: 1px solid #1976d2;
            color: #0d47a1;
            font-weight: 700;
            font-family: monospace;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .state-flag {
            background: #0057b7;
            color: #ffd700;
            padding: 0 3px;
            font-size: 8px;
            border-radius: 1px;
        }

        .vin-number-tag {
            background: #ffffff;
            border: 1px solid #1976d2;
            color: #0d47a1;
            font-weight: 700;
            font-family: monospace;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .part-number-tag {
            background: #fff3e0;
            border: 1px solid #ffb74d;
            color: #e65100;
            font-weight: 700;
            font-family: monospace;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .gallery-nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .gallery-nav-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .thumb-img {
            width: 60px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.6;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .thumb-img.active {
            opacity: 1;
            border-color: #29b6f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- ТОП-БАР НАВІГАЦІЇ -->
    <header class="border-b border-gray-200 bg-white">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between h-8 text-[11px] text-gray-600">
            <div class="flex items-center gap-4">
                <a href="index.html" class="hover:text-red-600">Головна</a>
                <a href="baza.html" class="hover:text-red-600">База знань</a>
                <a href="chat.html" class="hover:text-red-600">Чат</a>
                <span class="text-blue-600 font-bold"><i class="fa-solid fa-flag"></i> Підтримка ЗСУ</span>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="#" class="hover:text-red-600"><i class="fa-regular fa-heart"></i></a>
                <a href="#" class="hover:text-red-600"><i class="fa-regular fa-bell"></i></a>
                <span id="authStatusBadge" class="font-semibold text-gray-700 cursor-pointer" onclick="handleAuthClick()">👤 Особистий кабінет (Гість)</span>
            </div>
        </div>

        <!-- ОСНОВНА ШАПКА NEOSERVICE -->
        <div class="border-b border-gray-200 py-2.5 bg-white">
            <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
                
                <a href="auto.html" class="flex items-center gap-2.5 text-decoration-none">
                    <div class="bg-red-600 text-white font-black text-lg px-2.5 py-1 rounded tracking-tight shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-car-side"></i> NEO<span class="text-yellow-300">SERVICE</span>
                    </div>
                    <div class="text-[11px] text-gray-600 font-bold uppercase tracking-wider hidden sm:block">
                        Автобазар & Оголошення
                    </div>
                </a>

                <!-- Верхнє меню без зайвої кнопки "Всі оголошення" -->
                <nav class="hidden md:flex items-center gap-5 text-xs font-bold text-gray-800">
                    <a href="#" onclick="switchCategoryFilter('auto')" class="hover:text-red-600 pb-1">Автомобілі</a>
                    <a href="#" onclick="switchCategoryFilter('parts')" class="hover:text-red-600 pb-1">Автозапчастини</a>
                    <a href="#" class="hover:text-red
