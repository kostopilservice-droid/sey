<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a365d">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автокомерція & Автобазар — Neoservice</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1e3a8a;
            --auto-color: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
        }
        
        /* Навігація */
        nav {
            display: flex;
            justify-content: center;
            background: #0f172a;
            overflow-x: auto;
            border-bottom: 2px solid var(--auto-color);
        }
        nav a {
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            white-space: nowrap;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        nav a:hover { background-color: var(--auto-color); }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-orange { background: #fef3c7; color: #b45309; }
        .badge-green { background: #dcfce7; color: #15803d; }
        .badge-blue { background: #dbeafe; color: #1e40af; }

        .btn-add {
            background: var(--auto-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-add:hover { background: #b45309; }

        footer {
            text-align: center;
            padding: 20px;
            background: #0f172a;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header style="background: linear-gradient(135deg, #0f172a 0%, #b45309 100%); color: white; padding: 15px 20px; border-bottom: 3px solid #f59e0b;">
      <div style="max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 15px;">
        
        <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: white;">
          <div style="background: rgba(255, 255, 255, 0.15); border-radius: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem;">
            🚘
          </div>
          <div>
            <div style="font-size: 1.4rem; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase; line-height: 1.1;">
              NEO<span style="color: #fbbf24;">AUTO</span>
            </div>
            <div style="font-size: 0.78rem; color: #fef08a; font-style: italic; margin-top: 2px;">
              Автобазар • Запчастини • ЕБУ • Обладнання
            </div>
          </div>
        </a>

        <!-- Пошук -->
        <div style="flex: 1; max-width: 320px; min-width: 240px;">
          <div style="position: relative; width: 100%;">
            <span style="position: absolute; inset-y: 0; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; font-size: 0.85rem;">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="autoSearch" placeholder="Пошук запчастини чи авто..." style="width: 100%; box-sizing: border-box; padding: 8px 12px 8px 34px; font-size: 0.82rem; background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 10px; outline: none;" />
          </div>
        </div>

      </div>
    </header>

    <!-- НАВІГАЦІЯ -->
    <nav>
        <a href="index.html"><i class="fa-solid fa-house mr-1"></i> Головна</a>
        <a href="baza.html"><i class="fa-solid fa-book-open mr-1"></i> База знань</a>
        <a href="auto.html" style="background-color: var(--auto-color);"><i class="fa-solid fa-car mr-1"></i> Автокомерція & Маркет</a>
        <a href="chat.html"><i class="fa-solid fa-comments mr-1"></i> Чат</a>
    </nav>

    <div class="container">
      
      <!-- Заголовок + Кнопка додавання -->
      <div style="background: white; border-radius: 12px; padding: 20px; border-left: 5px solid var(--auto-color); box-shadow: 0 4px 6px rgba(0,0,0,0.04); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px;">
        <div>
          <h1 style="margin: 0 0 6px 0; font-size: 1.3rem; color: #1e3a8a;">🚗 Авторинок та Дошка Оголошень</h1>
          <p style="margin: 0; font-size: 0.85rem; color: #64748b;">
            Купівля та продаж авто, запчастин, блоків ЕБУ та діагностичних сканерів.
          </p>
        </div>

        <!-- Кнопка відкриття форми -->
        <div id="addBtnContainer">
          <button id="toggleFormBtn" class="btn-add">
            <i class="fa-solid fa-plus"></i> Додати оголошення
          </button>
        </div>
      </div>

      <!-- ФОРМА ДОДАВАННЯ ОГОЛОШЕННЯ (прихована за замовчуванням) -->
      <div id="newAdFormCard" style="display: none; background: white; border-radius: 12px; padding: 20px; margin-top: 20px; border: 2px dashed var(--auto-color); box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <h3 style="margin-top: 0; color: #1e3a8a; font-size: 1.05rem;"><i class="fa-solid fa-pen-to-square"></i> Нове оголошення</h3>
        
        <form id="addListingForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
          <div>
            <label style="font-size: 0.78rem; font-weight: bold; color: #475569;">Назва товару / Авто:</label>
            <input type="text" id="adTitle" placeholder="напр. Блок ЕБУ W210 або Сканер Launch" required style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; margin-top: 4px;" />
          </div>

          <div>
            <label style="font-size: 0.78rem; font-weight: bold; color: #475569;">Категорія:</label>
            <select id="adCategory" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; margin-top: 4px; background: white;">
              <option value="Автозапчастини">🚗 Автозапчастини</option>
              <option value="ЕБУ & Прошивки">⚡ ЕБУ & Прошивки</option>
              <option value="Діагностика">🔌 Сканери & Діагностика</option>
              <option value="Продаж авто">🚘 Продаж автомобілів</option>
            </select>
          </div>

          <div>
            <label style="font-size: 0.78rem; font-weight: bold; color: #475569;">Стан:</label>
            <select id="adCondition" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; margin-top: 4px; background: white;">
              <option value="Б/В">Б/В (Вживане)</option>
              <option value="Нове">Нове</option>
              <option value="Відновлене">Відновлене</option>
            </select>
          </div>

          <div>
            <label style="font-size: 0.78rem; font-weight: bold; color: #475569;">Ціна (грн):</label>
            <input type="number" id="adPrice" placeholder="напр. 2500" required style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; margin-top: 4px;" />
          </div>

          <div>
            <label style="font-size: 0.78rem; font-weight: bold; color: #475569;">Телефон / Telegram для зв'язку:</label>
            <input type="text" id="adContact" placeholder="напр. +38097... або @username" required style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; margin-top: 4px;" />
          </div>

          <div style="grid-column: 1 / -1;">
            <label style="font-size: 0.78rem; font-weight: bold; color: #475569;">Опис товару:</label>
            <textarea id="adDescription" rows="2" placeholder="Опишіть стан, сумісність або особливості..." required style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; margin-top: 4px; font-family: inherit;"></textarea>
          </div>

          <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" id="cancelFormBtn" style="padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer; font-size: 0.85rem;">Скасувати</button>
            <button type="submit" class="btn-add" style="padding: 8px 20px;">Опублікувати</button>
          </div>
        </form>
      </div>

      <!-- Сітка оголошень -->
      <div class="market-grid" id="autoProductsContainer">
        <p style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 30px;">Завантаження оголошень...</p>
      </div>

    </div>

    <footer>
        <p>&copy; 2026 Neoservice.ks.ua — Автобазар та маркетплейс.</p>
    </footer>

    <!-- Firebase модуль -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBlKoP6-M8tdrKq88bSdnWSnak5Gpddnpk",
    authDomain: "neoservice-ks-ua.firebaseapp.com",
    projectId: "neoservice-ks-ua",
    storageBucket: "neoservice-ks-ua.firebasestorage.app",
    messagingSenderId: "528941827813",
    appId: "1:528941827813:web:354ef989d200087634b60c",
    measurementId: "G-BYGHEHVYY3"
  };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const toggleFormBtn = document.getElementById('toggleFormBtn');
      const newAdFormCard = document.getElementById('newAdFormCard');
      const cancelFormBtn = document.getElementById('cancelFormBtn');
      const addListingForm = document.getElementById('addListingForm');
      const autoProductsContainer = document.getElementById('autoProductsContainer');

      let currentUser = null;

      // Перевірка авторизації
      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (!user) {
          toggleFormBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Увійдіть, щоб подати оголошення`;
        } else {
          toggleFormBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Подати оголошення`;
        }
      });

      toggleFormBtn.addEventListener('click', () => {
        if (!currentUser) {
          alert('Будь ласка, авторизуйтесь на головній сторінці або в Особистому Кабінеті, щоб подавати оголошення!');
          window.location.href = 'index.html#auth-section';
          return;
        }
        newAdFormCard.style.display = newAdFormCard.style.display === 'none' ? 'block' : 'none';
      });

      cancelFormBtn.addEventListener('click', () => {
        newAdFormCard.style.display = 'none';
      });

      // Збереження оголошення у Firebase
      addListingForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return;

        try {
          await addDoc(collection(db, "auto_listings"), {
            title: document.getElementById('adTitle').value,
            category: document.getElementById('adCategory').value,
            condition: document.getElementById('adCondition').value,
            price: Number(document.getElementById('adPrice').value),
            contact: document.getElementById('adContact').value,
            description: document.getElementById('adDescription').value,
            userEmail: currentUser.email,
            createdAt: serverTimestamp()
          });

          addListingForm.reset();
          newAdFormCard.style.display = 'none';
          alert('Ваше оголошення успішно опубліковано!');
        } catch (err) {
          alert('Помилка при публікації: ' + err.message);
        }
      });

      // Показ оголошень у реальному часі з Firebase
      const q = query(collection(db, "auto_listings"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        autoProductsContainer.innerHTML = '';

        if (snapshot.empty) {
          autoProductsContainer.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px; background: white; border-radius: 12px; border: 1px dashed #cbd5e1;">
              <p style="color: #64748b; margin: 0;">Оголошень поки немає. Будьте першим, хто додасть товар!</p>
            </div>
          `;
          return;
        }

        snapshot.forEach((doc) => {
          const item = doc.data();
          const card = document.createElement('div');
          card.className = 'product-card';

          const badgeClass = item.category === 'Продаж авто' ? 'badge-blue' : (item.category === 'ЕБУ & Прошивки' ? 'badge-green' : 'badge-orange');

          card.innerHTML = `
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="badge ${badgeClass}">${item.category}</span>
                <span style="font-size: 0.75rem; color: #94a3b8; font-weight: bold;">${item.condition}</span>
              </div>
              <h3 style="font-size: 0.95rem; margin: 0 0 6px 0; color: #1e3a8a;">${item.title}</h3>
              <p style="font-size: 0.78rem; color: #64748b; margin: 0 0 12px 0; line-height: 1.4;">${item.description}</p>
            </div>
            <div>
              <div style="font-size: 1.15rem; font-weight: bold; color: #d97706; margin-bottom: 8px;">${item.price.toLocaleString('uk-UA')} грн</div>
              <div style="font-size: 0.72rem; color: #64748b; margin-bottom: 8px;"><i class="fa-solid fa-phone"></i> ${item.contact}</div>
              <a href="tel:${item.contact}" style="display: block; text-align: center; padding: 8px; background: #1e3a8a; color: white; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: bold;">
                Зв'язатися
              </a>
            </div>
          `;
          autoProductsContainer.appendChild(card);
        });
      });

      // Пошук
      document.getElementById('autoSearch')?.addEventListener('input', function() {
        const queryVal = this.value.toLowerCase();
        const cards = document.querySelectorAll('.product-card');
        cards.forEach(card => {
          card.style.display = card.innerText.toLowerCase().includes(queryVal) ? 'flex' : 'none';
        });
      });
    </script>
</body>
</html>
