<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База знань — Neoservice</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-bold text-slate-900">База знань Neoservice</h1>
      <a href="admin.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-2xl shadow transition text-sm">
        ➕ Додати статтю (Адмінка)
      </a>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ ВИВОДУ СТАТЕЙ -->
    <div id="articlesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-3xl border border-slate-200">
        Завантаження матеріалів Бази знань...
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНЕ ВІКНО ДЛЯ ПЕРЕГЛЯДУ СТАТТІ -->
  <div id="articleModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 relative shadow-2xl">
      <button onclick="closeArticleModal()" class="absolute top-4 right-4 bg-slate-100 hover:bg-slate-200 text-slate-700 w-10 h-10 rounded-full flex items-center justify-center font-bold transition">
        ✕
      </button>
      
      <div id="modalCategory" class="inline-block bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase mb-3"></div>
      <h2 id="modalTitle" class="text-2xl font-bold text-slate-900 mb-4"></h2>
      
      <div id="modalMediaContainer" class="mb-6 rounded-2xl overflow-hidden bg-slate-100"></div>
      
      <div id="modalContent" class="text-slate-700 text-sm md:text-base leading-relaxed space-y-4 whitespace-pre-wrap"></div>
    </div>
  </div>

  <script>
    // 1. Конфігурація Firebase (введіть ваші ключі проекту)
const firebaseConfig = {
    apiKey: "AIzaSyBlKoP6-M8tdrKq88bSdnWSnak5Gpddnpk",
    authDomain: "neoservice-ks-ua.firebaseapp.com",
    projectId: "neoservice-ks-ua",
    storageBucket: "neoservice-ks-ua.firebasestorage.app",
    messagingSenderId: "528941827813",
    appId: "1:528941827813:web:354ef989d200087634b60c",
    measurementId: "G-BYGHEHVYY3"
  };;

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const categoryNames = {
      autodiagnostics: "🚗 Автодіагностика",
      pc: "💻 Ремонт ПК",
      office: "🖨️ Оргтехніка",
      radio: "📻 Радіозв'язок"
    };

    // 2. Завантаження статей із Firebase (без сортування, працює одразу)
    async function loadArticles() {
      const container = document.getElementById('articlesContainer');
      
      try {
        const snapshot = await db.collection('articles').get();
        
        if (snapshot.empty) {
          container.innerHTML = `
            <div class="col-span-full text-center py-12 text-slate-500 bg-white rounded-3xl border border-slate-200 shadow-sm">
              <p class="text-lg font-semibold">У Базі знань поки немає публікацій.</p>
              <p class="text-xs text-slate-400 mt-1">Скористайтеся адмін-панеллю, щоб додати першу статтю.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';

        snapshot.forEach(doc => {
          const article = doc.data();
          const categoryLabel = categoryNames[article.category] || article.category;
          
          const card = document.createElement('div');
          card.className = "bg-white rounded-3xl overflow-hidden shadow-md border border-slate-200 flex flex-col justify-between hover:shadow-lg transition duration-200";
          
          card.innerHTML = `
            <div>
              <div class="h-48 w-full overflow-hidden relative bg-slate-100">
                <img src="${article.imageUrl}" alt="${article.title}" class="w-full h-full object-cover">
                ${article.youtubeId ? '<span class="absolute bottom-3 right-3 bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow">▶ YouTube</span>' : ''}
              </div>
              <div class="p-6">
                <div class="flex items-center space-x-2 mb-3">
                  <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase">${categoryLabel}</span>
                </div>
                <h3 class="text-xl font-bold text-slate-900 mb-2">${article.title}</h3>
                <p class="text-slate-600 text-sm leading-relaxed mb-4">${article.summary}</p>
              </div>
            </div>
            <div class="px-6 pb-6 pt-0">
              <button onclick='openArticleModal(${JSON.stringify(article).replace(/'/g, "&apos;")})' class="w-full bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-700 font-semibold py-3 rounded-2xl text-sm transition duration-200">
                Читати далі
              </button>
            </div>
          `;
          
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Помилка завантаження статей:", error);
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-red-500 bg-white rounded-3xl border border-red-200">
            <p class="font-semibold">Помилка завантаження даних із бази.</p>
          </div>
        `;
      }
    }

    // 3. Відкриття модального вікна
    window.openArticleModal = function(article) {
      document.getElementById('modalCategory').innerText = categoryNames[article.category] || article.category;
      document.getElementById('modalTitle').innerText = article.title;
      document.getElementById('modalContent').innerText = article.content;

      const mediaContainer = document.getElementById('modalMediaContainer');
      
      if (article.youtubeId) {
        mediaContainer.innerHTML = `
          <div class="relative w-full" style="padding-bottom: 56.25%;">
            <iframe class="absolute top-0 left-0 w-full h-full rounded-2xl" src="https://www.youtube.com/embed/${article.youtubeId}" frameborder="0" allowfullscreen></iframe>
          </div>
        `;
      } else {
        mediaContainer.innerHTML = `
          <img src="${article.imageUrl}" alt="${article.title}" class="w-full h-64 md:h-80 object-cover rounded-2xl">
        `;
      }

      document.getElementById('articleModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    };

    // 4. Закриття модального вікна
    window.closeArticleModal = function() {
      document.getElementById('articleModal').classList.add('hidden');
      document.getElementById('modalMediaContainer').innerHTML = '';
      document.body.style.overflow = 'auto';
    };

    document.addEventListener('DOMContentLoaded', loadArticles);
  </script>
</body>
</html>
