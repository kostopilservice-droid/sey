<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База знань Neoservice</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

  <!-- ХЕПЕР / ШАПКА -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white p-2.5 rounded-2xl shadow-md font-bold text-lg">NS</div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">База знань Neoservice</h1>
          <p class="text-xs text-slate-500">Практичні рішення, інструкції та поради</p>
        </div>
      </div>
      <!-- Кнопку адмінки прибрано з публічного доступу -->
    </div>
  </header>

  <!-- ОСНОВНИЙ КОНТЕЙНЕР -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- ФІЛЬТРИ КАТЕГОРІЙ -->
    <div class="flex flex-wrap gap-2 mb-8 pb-4 border-b border-slate-200" id="categoryFilters">
      <button data-category="all" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition">Усі категорії</button>
      <button data-category="autodiagnostics" class="filter-btn bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition">🚗 Автодіагностика</button>
      <button data-category="pc" class="filter-btn bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition">💻 Комп'ютери</button>
      <button data-category="office" class="filter-btn bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition">🖨️ Оргтехніка</button>
      <button data-category="radio" class="filter-btn bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition">📻 Радіозв'язок</button>
    </div>

    <!-- СТРИЧКА СТАТЕЙ -->
    <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Стьожки завантажуватимуться з Firestore -->
      <div class="col-span-full text-center py-12 text-slate-400">Завантаження статей...</div>
    </div>

  </main>

  <!-- МОДАЛЬНЕ ВІКНО ПЕРЕГЛЯДУ СТАТТІ -->
  <div id="articleModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 shadow-2xl relative border border-slate-100">
      <button id="closeModal" class="absolute top-6 right-6 bg-slate-100 hover:bg-slate-200 text-slate-600 w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg transition">✕</button>
      
      <div id="modalCategory" class="inline-block bg-blue-50 text-blue-600 font-semibold text-xs px-3 py-1 rounded-lg mb-3"></div>
      <h2 id="modalTitle" class="text-2xl font-bold text-slate-900 mb-4"></h2>
      
      <div id="modalMediaContainer" class="mb-6 rounded-2xl overflow-hidden shadow-md hidden">
        <!-- Зображення або YouTube відео -->
      </div>

      <div id="modalContent" class="text-slate-600 text-sm leading-relaxed space-y-4 whitespace-pre-line"></div>
    </div>
  </div>

  <script>
    // Конфігурація Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBlKoP6-M8tdrKq88bSdnWSnak5Gpddnpk",
    authDomain: "neoservice-ks-ua.firebaseapp.com",
    projectId: "neoservice-ks-ua",
    storageBucket: "neoservice-ks-ua.firebasestorage.app",
    messagingSenderId: "528941827813",
    appId: "1:528941827813:web:354ef989d200087634b60c",
    measurementId: "G-BYGHEHVYY3"
  };;

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let allArticles = [];
    let currentCategory = 'all';

    const articlesGrid = document.getElementById('articlesGrid');
    const articleModal = document.getElementById('articleModal');
    const closeModal = document.getElementById('closeModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalCategory = document.getElementById('modalCategory');
    const modalContent = document.getElementById('modalContent');
    const modalMediaContainer = document.getElementById('modalMediaContainer');

    // Мапа категорій для красивих назв
    const categoryNames = {
      autodiagnostics: '🚗 Автодіагностика',
      pc: '💻 Комп\'ютери',
      office: '🖨️ Оргтехніка',
      radio: '📻 Радіозв\'язок'
    };

    // Завантаження статей з Firestore
    async function fetchArticles() {
      try {
        const snapshot = await db.collection('articles').orderBy('createdAt', 'desc').get();
        allArticles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderArticles();
      } catch (error) {
        console.error("Помилка завантаження статей:", error);
        articlesGrid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500 font-medium">Помилка завантаження бази даних. Спробуйте оновити сторінку.</div>`;
      }
    }

    // Рендер карток
    function renderArticles() {
      const filtered = currentCategory === 'all' 
        ? allArticles 
        : allArticles.filter(item => item.category === currentCategory);

      if (filtered.length === 0) {
        articlesGrid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">У цій категорії поки немає опублікованих статей.</div>`;
        return;
      }

      articlesGrid.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col hover:shadow-md transition duration-200 group">
          <div class="h-48 overflow-hidden bg-slate-100 relative">
            <img src="${item.imageUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/600x400?text=Neoservice'">
            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-slate-800 text-xs font-semibold px-3 py-1 rounded-xl shadow-sm">
              ${categoryNames[item.category] || item.category}
            </span>
          </div>
          <div class="p-6 flex flex-col flex-grow">
            <h3 class="text-lg font-bold text-slate-900 mb-2 group-hover:text-blue-600 transition">${escapeHtml(item.title)}</h3>
            <p class="text-slate-500 text-xs line-clamp-3 mb-6 flex-grow">${escapeHtml(item.summary)}</p>
            <button onclick="openArticle('${item.id}')" class="w-full bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-700 font-semibold py-2.5 rounded-2xl transition text-xs">
              Читати далі
            </button>
          </div>
        </div>
      `).join('');
    }

    // Відкриття модального вікна
    window.openArticle = function(id) {
      const article = allArticles.find(item => item.id === id);
      if (!article) return;

      modalTitle.innerText = article.title;
      modalCategory.innerText = categoryNames[article.category] || article.category;
      modalContent.innerText = article.content;

      // Медіа (зображення або YouTube)
      modalMediaContainer.classList.remove('hidden');
      if (article.youtubeId) {
        modalMediaContainer.innerHTML = `
          <div class="aspect-video w-full">
            <iframe src="https://www.youtube.com/embed/${article.youtubeId}" class="w-full h-full rounded-2xl" frameborder="0" allowfullscreen></iframe>
          </div>
        `;
      } else if (article.imageUrl) {
        modalMediaContainer.innerHTML = `
          <img src="${article.imageUrl}" alt="${article.title}" class="w-full max-h-80 object-cover rounded-2xl">
        `;
      } else {
        modalMediaContainer.classList.add('hidden');
      }

      articleModal.classList.remove('hidden');
    }

    // Закриття модального вікна
    closeModal.addEventListener('click', () => articleModal.classList.add('hidden'));
    articleModal.addEventListener('click', (e) => {
      if (e.target === articleModal) articleModal.classList.add('hidden');
    });

    // Фільтрація
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-blue-600', 'text-white', 'shadow');
          b.classList.add('bg-white', 'text-slate-700', 'border', 'border-slate-200');
        });
        e.target.classList.remove('bg-white', 'text-slate-700', 'border', 'border-slate-200');
        e.target.classList.add('bg-blue-600', 'text-white', 'shadow');

        currentCategory = e.target.getAttribute('data-category');
        renderArticles();
      });
    });

    // Захист від XSS
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Стартове завантаження
    fetchArticles();
  </script>
</body>
</html>
